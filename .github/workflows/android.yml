name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Ubuntu 24.04 bringt das Android-SDK schon mit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK prüfen
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            ls "$ANDROID_HOME/platforms" || true
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          } 2>&1 | tee -a build.log

      - name: Abhängigkeiten installieren
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a build.log

      - name: Android-Projekt erzeugen
        run: |
          set -o pipefail
          {
            [ -d android ] || npx cap add android
            npx cap sync android
          } 2>&1 | tee -a build.log
          # Versionsnummer hochzählen, damit Updates sauber installiert werden
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: App-Icon und Startbild erzeugen
        continue-on-error: true
        run: npx @capacitor/assets generate --android 2>&1 | tee -a build.log

      - name: Festen Signaturschlüssel bereitstellen
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK bauen
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: APK als Release „neueste“ bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk artenquiz.apk
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste artenquiz.apk \
            --title "Artenquiz – Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy artenquiz.apk herunterladen und installieren." \
            --prerelease

      # Bei Fehlern das Ende des Protokolls als Hinweis anzeigen (sichtbar in der Übersicht des Laufs)
      - name: Fehlerprotokoll
        if: failure()
        run: |
          [ -f build.log ] || echo "kein Protokoll" > build.log
          grep -iE "error|failed|exception|what went wrong" build.log | tail -n 40 > err.txt || true
          tail -n 60 build.log > tail.txt
          msg=$(cat err.txt; echo "-----"; cat tail.txt)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Build-Protokoll::${msg}"
